[project]
name = "entzun"
version = "0.1.0"
description = "Entzun: AI copilot for sentiment analysis and meeting summaries"
readme = "README.md"
requires-python = ">=3.14,<4"
authors = [{ name = "Endika Iglesias", email = "endika2@gmail.com" }]
dependencies = [
    "openai>=2.30,<4.0",
    "SpeechRecognition>=3.16,<4",
    "matplotlib>=3.9.3,<4",
    "fpdf>=1.7.2,<2",
    "PyAudio>=0.2.14,<0.3",
    "pydub>=0.25.1,<0.26",
    "python-dotenv>=1.0.1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9,<0.17.0",
    "mypy>=1.20,<3.0",
    "pytest>=9.0.2,<10",
    "pre-commit>=4.5.1,<5",
    "pytest-cov>=7.1.0,<8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "speech_recognition.*",
    "fpdf.*",
    "matplotlib.*",
    "pydub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["entzun"]

[tool.coverage.report]
omit = [
    "entzun/ui/app.py",
]
